{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon: circular crop of the profile photo -->
<link rel="icon" type="image/png" href="{{ base_path }}/images/photo-favicon-32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/photo-favicon-192.png" sizes="192x192"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/photo-apple-touch-180.png"/>
<link rel="shortcut icon" href="{{ base_path }}/images/photo-favicon.ico"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Site font (change the family here and in assets/css/custom.css) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<!-- end custom head snippets -->
